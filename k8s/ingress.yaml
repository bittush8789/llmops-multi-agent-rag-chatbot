apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: technova-ingress
  namespace: technova
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: technova.ai.local  # Change to your domain for EKS
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: technova-service
            port:
              number: 80
